services:
  bmw-bridge:
    # WICHTIG: Hier steht jetzt der neue, kurze Name!
    image: ghcr.io/bausi2k/bmw-mqtt-bridge:latest
    
    container_name: bmw-bridge
    restart: unless-stopped
    
    ports:
      - "${WEB_PORT:-8999}:${WEB_PORT:-8999}"
      # Nur fuer die optionale Keba-Wallbox (KEBA_HOST in der .env):
      # Die Wallbox antwortet ausschliesslich an Port 7090, nicht an den
      # Quellport. Bewusst auskommentiert - ist der Port auf dem Host
      # belegt, startet der Container sonst gar nicht.
      # - "7090:7090/udp"
    
    env_file:
      - .env
    
    volumes:
      - ./bmw_tokens.json:/app/bmw_tokens.json
      - ./vehicle.json:/app/vehicle.json
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./data:/app/data
      
    environment:
      - TZ=Europe/Vienna